[URL]
GameName=KillBugs

[/Script/EngineSettings.GameMapsSettings]
; Generated by Tools/kb_setup_arena.py and Tools/kb_setup_lobby.py - re-run those to rebuild.
;
; A running game starts in the lobby, not in the arena: the point of the lobby is to gather
; players before wave 0, and starting straight into a wave leaves nobody any way to join.
;
; The editor opens the lobby too, so that pressing Play does what running the game does. It
; used to open the arena to keep the combat loop one click away, and that turned out to be
; actively misleading: PIE copied the editor world, so the arena's game mode ran, the wave
; clock started, and there was no lobby and no way to make a room - the game appeared to skip
; the entire feature. Note that PIE plays whatever level is OPEN in the editor, so opening
; Lvl_Arena by hand is still the way to jump straight into combat.
EditorStartupMap=/Game/KillBugs/Maps/Lvl_Lobby.Lvl_Lobby
GameDefaultMap=/Game/KillBugs/Maps/Lvl_Lobby.Lvl_Lobby
TransitionMap=
; KillBugs: the four players are four separate network clients, each with its own mouse-aim.
; Splitscreen would render the swarm into four viewports (4x render cost) and push the
; camera manager down a local-player-count path that fights the fixed follow camera.
; Shared-camera local co-op (2 gamepads, one screen) needs no splitscreen at all.
bUseSplitscreen=False
TwoPlayerSplitscreenLayout=Horizontal
ThreePlayerSplitscreenLayout=FavorTop
; KillBugs runs on the C++ game mode. The template's BP_ThirdPersonGameMode is left in place
; (nothing else references it) but is no longer the project default.
GlobalDefaultGameMode=/Script/KillBugs.KBGameMode
GlobalDefaultServerGameMode=None
bOffsetPlayerGamepadIds=False

[/Script/Engine.RendererSettings]
; KillBugs: flat top-down arena with up to ~500 continuously moving swarm meshes.
; Lumen's cost is dominated by surface-cache invalidation, which scales with scene churn -
; exactly our workload - and it buys nothing visually under a fixed overhead camera.
; Virtual Shadow Maps are worse still: their per-primitive cache pass degrades with the
; number of MOVING primitives. Plain CSM (MaxCascades=1) is the right choice here.
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.Lumen.TraceMeshSDFs=0
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False

r.SkinCache.CompileShaders=True

r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

