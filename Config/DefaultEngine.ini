; ---------------------------------------------------------------------------
; KillBugs additions below this line
; ---------------------------------------------------------------------------

; The swarm replicates as one FFastArraySerializer on a single always-relevant actor.
; Worst case is 500 items x ~12 bytes = 6 KB per update at 15 Hz = 90 KB/s per connection,
; which sits exactly on the engine default ceiling of 100000 and produces an unexplained
; stutter with no obvious cause. Staggered dirty-marking cuts it to ~30 KB/s; this raises
; the ceiling so the ceiling is never the thing we are measuring.
[/Script/OnlineSubsystemUtils.IpNetDriver]
MaxClientRate=1000000
MaxInternetClientRate=1000000

[OnlineSubsystem]
; LAN lobby discovery runs on OnlineSubsystemNull's built-in beacon: a session created with
; bIsLANMatch advertises itself over UDP, and a search with bIsLanQuery collects the replies.
; We consume the ordinary IOnlineSession interface and never touch the beacon directly.
;
; Without this line IOnlineSubsystem::Get() has no session interface, and the lobby would sit
; there finding zero games forever with nothing in the log to say why. The engine's own
; BaseEngine.ini leaves this unset, so it has to be named here.
DefaultPlatformService=Null

; [SystemSettings] is dispatched at ECVF_SetBySystemSettingsIni priority, so these win over
; the per-project renderer defaults above without editing them line by line.
[SystemSettings]
r.ScreenPercentage=100
; TSR (4) handles hundreds of tiny moving targets far better than TAA/FXAA.
r.AntiAliasingMethod=4
; The swarm renders through HISM with plain static meshes, so Nanite is pure overhead here.
r.Nanite=0
; Death/hit VFX pooling budget. NOTE: r.Niagara.MaxSystemInstances alone is NOT enough -
; a per-frame spawn budget is enforced in code too (see the swarm VFX note in the plan).
fx.Niagara.QualityLevel=2
r.Niagara.MaxSystemInstances=64
r.Shadow.CSM.MaxCascades=1
; DX12 PSO compilation is a stutter source; use the bundled pipeline cache instead.
r.ShaderPipelineCache.Enabled=1

