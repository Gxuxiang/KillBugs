[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=E8861C5C4885962BA64E309F6E3C0F26
ProjectName=Third Person BP Game Template

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

; ---------------------------------------------------------------------------------------
; KillBugs tuning. The same values are editable with a proper UI in
;     Project Settings -> Game -> KillBugs
; Editing them here is equivalent and works without opening the editor at all.
;
; Only values that differ from the C++ defaults need to be listed; anything absent falls
; back to KBGameSettings.h.
; ---------------------------------------------------------------------------------------
[/Script/KillBugs.KBGameSettings]

; --- Wave cycle: draft -> flood -> mop up and loot -> draft -----------------------------
WarmupSeconds=15.0
WaveSeconds=45.0
ExploreSeconds=90.0

; --- Enemy pressure. BaseSpawnRate is bugs per second, not a per-wave quota --------------
BaseSpawnRate=4.0
SpawnRatePerWave=1.5
ExploreAmbientSpawnRate=0.4
MaxAliveDuringWave=450
SpawnBatchSize=12

; Must stay beyond the camera's visible ground radius, or bugs appear in view.
MinSpawnDistance=2400.0
MaxSpawnDistance=3300.0

; --- Phase scaling. Explore softens leftovers so the mop-up leaves time to search --------
WaveEnemyDamageTakenScale=1.0
WaveEnemySpeedScale=1.0
ExploreEnemyDamageTakenScale=3.0
ExploreEnemySpeedScale=0.6

; --- Contact damage ----------------------------------------------------------------------
ContactDamageInterval=0.6
ContactGap=15.0
MaxSimultaneousContacts=3

; --- Bullet ------------------------------------------------------------------------------
; 飞行物的特效（Niagara）。在飞的每颗子弹挂一个该系统跟着它走，命中或超程时销毁。
;
; 留空则退回默认球体。球体只是占位、不参与碰撞 —— 命中判定是每帧的扫掠球，和这里无关，
; 所以换特效不影响手感。
;
; 完整对象路径（/Game/.../Name.Name），和 SlimeDecalMaterial 一样 —— 包路径在本工程里
; 解析不出资产。
ProjectileEffect=/Game/KillBugs/VFX/FX_bullet.FX_bullet

; --- Swarm capacity ----------------------------------------------------------------------
MaxEnemies=600
ArenaHalfExtent=5500.0

; --- Player ------------------------------------------------------------------------------
BaseMaxHealth=100.0
BaseMoveSpeed=700.0
BasePickupRadius=90.0
; Lobby room capacity: the session's NumPublicConnections and the "x/N" in the lobby UI.
MaxPlayers=4

; --- Card draft --------------------------------------------------------------------------
CardsPerDraft=3
DraftSeconds=60.0
DraftInputLockSeconds=1.0

; --- Camera ------------------------------------------------------------------------------
CameraPitch=-65.0
CameraDistance=1800.0
CameraFieldOfView=70.0

; --- Audio -------------------------------------------------------------------------------
; Asset paths. Unset means silent, never a crash, so any of these can be blanked out.
;
; Music is the SoundMorph weather beds rather than the 1_drone_* samples: the drones are
; SoundWaves with looping=False, i.e. one-shots, and would stop after a minute.
; Both beds are sustained, so they are crossfaded by volume rather than restarted.
WaveMusic=/Game/KillBugs/Sound/Music/fight.fight
ExploreMusic=/Game/KillBugs/Sound/Music/soothing.soothing
MusicVolume=0.500000
MusicCrossfadeSeconds=2.5

CardHoverSound=/Game/SoundMorphMetaSounds/UI/Presets/UI_Buttons_Preset_2.UI_Buttons_Preset_2
CardPickSound=/Game/SoundMorphMetaSounds/Retro/Presets/CoinRandom_Preset_1.CoinRandom_Preset_1
CardDraftOpenSound=/Game/KillBugs/Sound/Music/card.card
UiVolume=0.7

; 死亡粘液贴花。必须是 Deferred Decal 域的材质（见 Tools/kb_check_slime.py）。
;
; 完整对象路径（/Game/.../Name.Name），不是包路径 —— 后者在本工程里解析不出资产。
SlimeDecalMaterial=/Game/KillBugs/Enemies/M_KBSlime.M_KBSlime

; ---------------------------------------------------------------------------------------
; 撤离
;
; 两个钟互斥，任何时刻只有一个在走：
;   开启时间 = 只在「不是全员存活且都在圈里」时走。走完 = 这次撤离失败：
;              撤离点关闭、这一局继续、过 ExtractionWaveInterval 波再出现。
;   撤离计时 = 只在全员都在圈里时走，同时把开启时间冻住。走完 = 撤离成功，这一局结束。
; 所以整段撤离最多占用 ExtractionOpenWindowSeconds + ExtractionSeconds 秒，
; Explore 阶段会被撑到至少这么长，保证它不跨阶段。
;
; 虫潮只跟「读条」走：撤离点出现时什么都不发生，是玩家全员进圈的那一刻
; （ExtractionOpeningBurst 一波 + ExtractionSpawnRate 持续），人一出去就停。
; 跑过去的那段路维持 Explore 的平静——否则最难的会变成"走过去"，而不是"守住"。
; ---------------------------------------------------------------------------------------
ExtractionRadius=700.0
ExtractionSeconds=30.0
ExtractionOpenWindowSeconds=60.0
ExtractionPhaseTailSeconds=5.0
ExtractionFirstWave=3
ExtractionWaveInterval=3
ExtractionSpawnRate=6.0
ExtractionAliveCap=520
ExtractionOpeningBurst=30
ExtractionEdgeMargin=600.0

; ---------------------------------------------------------------------------------------
; 搜刮
;
; 掉落物在地面上存在，走过去自动拾取（没有按键）。药包进背包，由按键使用。
; MaterialDropMesh / MedkitDropMesh 留空会回落到引擎自带方块并警告一次 —— 先用占位顶着，
; 因为“功能是好的但看不见”是最难查的那种 bug。
; ---------------------------------------------------------------------------------------
MedkitHealAmount=40.0

; 背包容量 = 重量。材料按 MaterialUnitWeight 计重，药包按 MedkitWeight 计重。
; 225 材料 + 3 药包 = 300 整，这是搜刮取舍的标尺；要放宽就改这里，不用重编译。
BackpackCapacity=300
MaterialUnitWeight=1
MedkitWeight=25
; 丢出去的东西落多远。必须大于卡牌加成后的最大拾取半径(135)，否则会被自己捡回来。
DroppedItemDistance=160.0
MaxDrops=128
DropHeightOffset=35.0
DropScale=0.6
MaterialDropTint=(R=0.86,G=0.62,B=0.20,A=1.0)
MedkitDropTint=(R=0.28,G=0.82,B=0.44,A=1.0)

; ---------------------------------------------------------------------------------------
; The hard player cap for a hosted room.
;
; NOT the same thing as KBGameSettings::MaxPlayers, and both are needed. The session's
; NumPublicConnections is only an advertised number: OnlineSubsystemNull never refuses a
; join, so it tells the LAN how big the room claims to be and nothing more. The actual
; refusal happens in AGameSession::AtCapacity, reached from AGameModeBase::PreLogin, and it
; reads THIS value - which the engine defaults to 16. Without it, a "4 player" room quietly
; accepts a fifth.
;
; The two are kept in step by hand because the engine's game session cannot see UKBGameSettings.
; If you change the room size, change both.
; ---------------------------------------------------------------------------------------
PlayerDamageCameraShake=/Script/Engine.BlueprintGeneratedClass'/Game/KillBugs/Camera/CS_Damage.CS_Damage_C'

[/Script/Engine.GameSession]
MaxPlayers=4

; ---------------------------------------------------------------------------------------
; Packaging: the arena has to be listed, or it is not cooked.
;
; The cooker only packs what it can REACH BY REFERENCE. Lvl_Lobby travels fine because it is
; the GameDefaultMap; Lvl_Arena is referenced from exactly one place, and that place is a
; string literal in C++ (KBTravel::ToArenaAsListenServer). The cooker does not read strings -
; so without this list a packaged build starts a run and then fails to travel, with nothing
; in the log about why. Found while preparing the first LAN build, before it cost a test round.
;
; Adding a new map by hand now means adding it here too. (The alternative, a hard reference
; from an always-cooked asset, would load the arena into memory while sitting in the lobby.)
; ---------------------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/KillBugs/Maps/Lvl_Arena")
+MapsToCook=(FilePath="/Game/KillBugs/Maps/Lvl_Lobby")

; And the game's own content directory, in full.
;
; The cooker only packs what it can REACH BY REFERENCE, and two things in this project are
; reached by neither a reference nor a map: UKBContentSubsystem finds the weapons and the cards
; by SCANNING /Game/KillBugs/Weapons and /Game/KillBugs/Cards at runtime, and the cooker does
; not read a directory scan. Measured before this line existed: a packaged build shipped 43
; files under Content/KillBugs and neither Weapons nor Cards among them - an empty shop, no
; cards on a wave end, and a pawn that spawns holding nothing. The editor had all of it, which
; is what makes it hard to believe.
;
; The whole tree rather than the two directories: the alternative is remembering, every time a
; new scanned directory appears, that it needs a line here as well. (Enemies never needed one
; because AKBEnemyDirector hard-references them from its constructor; Mesh, Sound, Textures and
; VFX are referenced by the assets that use them.)
;
; Symptom to recognise it by: it looks exactly like "the player owns no weapons", which is ALSO
; what a wipe produces - so check whether the stash is simply empty before chasing this.
; ---------------------------------------------------------------------------------------
+DirectoriesToAlwaysCook=(Path="/Game/KillBugs")

